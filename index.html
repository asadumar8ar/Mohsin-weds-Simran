<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nikah Card Builder</title>

<!-- The only external resource allowed: Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=Great+Vibes&amp;family=Noto+Nastaliq+Urdu:wght@400;600&amp;family=Reem+Kufi:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<style>
  /* ---------- tiny reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-size: 16px;
    line-height: 1.5;
    color: #e9f2ec;
    background: #020b08;
    background-image:
      radial-gradient(900px 520px at 50% -12%, #0e4030 0%, rgba(4,21,15,0) 62%),
      radial-gradient(700px 420px at 92% 108%, #0a2b21 0%, rgba(2,11,8,0) 60%),
      linear-gradient(180deg, #04150f 0%, #020b08 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- loader ---------- */
  #loader {
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 42%, #0d3a2a 0%, #04150f 68%, #020b08 100%);
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    letter-spacing: 0.09em;
    color: #f2d98a;
  }
  .loader-ring {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 3px solid rgba(212, 175, 55, 0.22);
    border-top-color: #f2d98a;
    animation: nikahSpin 1s linear infinite;
  }
  #loader p { margin: 0; font-size: 14px; }
  @keyframes nikahSpin { to { transform: rotate(360deg); } }

  /* ---------- error box ---------- */
  #errorBox {
    position: relative;
    z-index: 60;
    margin: 14px 20px 0;
    padding: 14px 16px;
    border-radius: 12px;
    background: #3a0d10;
    border: 1px solid #ff6b6b;
    color: #ffd9d9;
    font-family: ui-monospace, Menlo, Consolas, 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  /* ---------- header ---------- */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 20px;
    background: rgba(4, 20, 15, 0.94);
    border-bottom: 1px solid rgba(212, 175, 55, 0.28);
  }
  .app-header h1 {
    margin: 0;
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #f2d98a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }

  /* ---------- buttons ---------- */
  .btn {
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid rgba(212, 175, 55, 0.55);
    background: transparent;
    color: #f2d98a;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
  }
  .btn:hover { background: rgba(212, 175, 55, 0.14); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid #f2d98a; outline-offset: 2px; }
  .btn-gold {
    background: linear-gradient(180deg, #f6dd94 0%, #d4af37 100%);
    color: #08251b;
    border-color: #d4af37;
    font-weight: 600;
  }
  .btn-gold:hover { background: linear-gradient(180deg, #ffe9ab 0%, #e0bd4c 100%); }
  .btn-sm { font-size: 11px; padding: 5px 10px; letter-spacing: 0.04em; }
  .danger { border-color: rgba(255, 107, 107, 0.6); color: #ffb3b3; }
  .danger:hover { background: rgba(255, 107, 107, 0.14); }

  /* ---------- layout ---------- */
  .app-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 460px;
    gap: 24px;
    align-items: start;
    max-width: 1400px;
    margin: 0 auto;
    padding: 22px 20px 48px;
  }

  /* ---------- editor panel ---------- */
  #editor {
    background: linear-gradient(180deg, rgba(11, 45, 34, 0.92) 0%, rgba(6, 26, 20, 0.96) 100%);
    border: 1px solid rgba(212, 175, 55, 0.26);
    border-radius: 16px;
    padding: 16px;
    max-height: calc(100vh - 108px);
    overflow-y: auto;
    overflow-x: hidden;
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.42);
  }
  #editor::-webkit-scrollbar { width: 9px; }
  #editor::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 9px; }
  #editor::-webkit-scrollbar-thumb {
    background: rgba(212, 175, 55, 0.35);
    border-radius: 9px;
  }

  .sheet-handle { display: none; }
  .sheet-grip {
    width: 46px;
    height: 5px;
    border-radius: 3px;
    background: rgba(212, 175, 55, 0.5);
    margin: 0 auto 12px;
  }

  /* ---------- tabs ---------- */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 14px;
    padding: 0 0 12px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.18);
  }
  .tab {
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid rgba(212, 175, 55, 0.28);
    background: rgba(255, 255, 255, 0.03);
    color: #c9d8cf;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
  }
  .tab:hover { color: #f2d98a; border-color: rgba(212, 175, 55, 0.62); }
  .tab:focus-visible { outline: 2px solid #f2d98a; outline-offset: 2px; }
  .tab.active {
    background: linear-gradient(180deg, #f6dd94 0%, #d4af37 100%);
    color: #08251b;
    border-color: #d4af37;
    font-weight: 600;
  }

  /* ---------- panels ---------- */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ---------- form controls ---------- */
  .field { margin-bottom: 12px; }
  .field > label,
  .field-label {
    display: block;
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8fb3a3;
    margin-bottom: 5px;
  }
  input[type="text"],
  input[type="date"],
  input[type="time"],
  input[type="tel"],
  input[type="url"],
  input[type="number"],
  input[type="search"],
  textarea,
  select {
    width: 100%;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid rgba(212, 175, 55, 0.22);
    background: rgba(2, 16, 11, 0.72);
    color: #eaf4ee;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
    line-height: 1.35;
  }
  textarea { min-height: 72px; resize: vertical; }
  input:hover, textarea:hover, select:hover { border-color: rgba(212, 175, 55, 0.42); }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #d4af37;
    box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.18);
  }
  input::placeholder, textarea::placeholder { color: #5f7f70; }

  input[type="file"] {
    width: 100%;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14px;
    color: #b9cdc3;
    padding: 8px 0;
  }
  input[type="file"]::file-selector-button {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 7px 12px;
    margin-right: 10px;
    border-radius: 999px;
    border: 1px solid rgba(212, 175, 55, 0.5);
    background: rgba(212, 175, 55, 0.12);
    color: #f2d98a;
    cursor: pointer;
  }

  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #d4af37;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px dashed rgba(212, 175, 55, 0.14);
  }
  .switch-row span {
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    font-size: 12px;
    color: #c9d8cf;
  }

  .hint {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13.5px;
    line-height: 1.45;
    color: #7fa392;
    margin: 4px 0 12px;
  }

  /* ---------- event / repeatable item cards ---------- */
  .item-card {
    border: 1px solid rgba(212, 175, 55, 0.22);
    border-radius: 12px;
    padding: 10px 11px;
    margin-bottom: 10px;
    background: rgba(255, 255, 255, 0.025);
  }
  .item-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 9px;
  }
  .item-title {
    flex: 1 1 auto;
    min-width: 90px;
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    font-size: 13px;
    color: #f2d98a;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge-main {
    background: linear-gradient(180deg, #f6dd94 0%, #d4af37 100%);
    color: #08251b;
    font-family: 'Reem Kufi', sans-serif;
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ---------- theme picker ---------- */
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .theme-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px;
    border-radius: 11px;
    border: 1px solid rgba(212, 175, 55, 0.25);
    background: rgba(255, 255, 255, 0.03);
    color: #dfeae4;
    cursor: pointer;
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    font-size: 12px;
    text-align: left;
  }
  .theme-btn:hover { border-color: rgba(212, 175, 55, 0.6); }
  .theme-btn:focus-visible { outline: 2px solid #f2d98a; outline-offset: 2px; }
  .theme-btn.active {
    border-color: #d4af37;
    box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.24);
  }
  .swatch {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.28);
  }

  /* ---------- photo grid ---------- */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .photo-cell {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(212, 175, 55, 0.3);
    background: #02100b;
    aspect-ratio: 1 / 1;
  }
  .photo-cell img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .photo-cell .photo-remove {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 22px;
    height: 22px;
    line-height: 1;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(20, 4, 6, 0.82);
    color: #ffd9d9;
    font-size: 14px;
    cursor: pointer;
  }
  .photo-cell .photo-remove:hover { background: #7a1b1b; }

  /* ---------- note + save indicator ---------- */
  .note {
    margin: 16px 0 0;
    padding: 11px 13px;
    border-left: 3px solid #d4af37;
    border-radius: 0 10px 10px 0;
    background: rgba(212, 175, 55, 0.08);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 13.5px;
    line-height: 1.5;
    color: #cfe0d7;
  }
  .save-note {
    margin: 12px 0 0;
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    font-size: 11px;
    letter-spacing: 0.07em;
    color: #6f9c88;
    transition: color 0.3s ease;
  }
  .save-note.flash { color: #f2d98a; }

  /* ---------- preview / phone ---------- */
  .preview-wrap {
    position: sticky;
    top: 88px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .phone {
    position: relative;
    width: 100%;
    max-width: 390px;
    height: min(76vh, 800px);
    padding: 10px;
    border-radius: 38px;
    border: 1px solid rgba(212, 175, 55, 0.38);
    background: #03100c;
    box-shadow:
      0 26px 60px rgba(0, 0, 0, 0.55),
      0 0 0 8px rgba(212, 175, 55, 0.06),
      0 0 40px rgba(212, 175, 55, 0.08);
  }
  #previewFrame {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 28px;
    background: #06231a;
  }
  .preview-label {
    font-family: 'Reem Kufi', 'Cormorant Garamond', sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6f9c88;
  }

  /* ---------- mobile edit button + backdrop ---------- */
  .edit-fab {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 46;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid #d4af37;
    background: linear-gradient(180deg, #f6dd94 0%, #d4af37 100%);
    color: #08251b;
    font-family: 'Reem Kufi', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.52);
  }
  .edit-fab:focus-visible { outline: 2px solid #f2d98a; outline-offset: 3px; }

  .sheet-backdrop {
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    z-index: 44;
    background: rgba(0, 0, 0, 0.62);
  }

  /* ---------- mobile layout (under 800px) ---------- */
  @media (max-width: 799px) {
    .app-header { padding: 11px 14px; }
    .app-header h1 { font-size: 12.5px; letter-spacing: 0.12em; }
    .btn { font-size: 12px; padding: 8px 13px; }

    .app-main {
      grid-template-columns: minmax(0, 1fr);
      padding: 12px 12px 96px;
      gap: 14px;
    }

    .preview-wrap { position: static; }
    .phone {
      max-width: 340px;
      height: 64vh;
      min-height: 420px;
      border-radius: 30px;
      padding: 8px;
    }
    #previewFrame { border-radius: 22px; }

    /* the editor becomes a bottom sheet */
    #editor {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: auto;
      z-index: 45;
      max-height: 82vh;
      max-width: none;
      margin: 0;
      border-radius: 18px 18px 0 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      padding: 12px 14px 26px;
      box-shadow: 0 -22px 54px rgba(0, 0, 0, 0.66);
      transform: translateY(105%);
      transition: transform 0.28s ease;
    }
    #editor.open { transform: translateY(0); }

    .sheet-handle { display: block; }
    .edit-fab { display: inline-flex; }

    .row2 { grid-template-columns: 1fr; }
    .theme-grid { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 380px) {
    .theme-grid { grid-template-columns: 1fr; }
    .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* respect users who dislike motion */
  @media (prefers-reduced-motion: reduce) {
    .loader-ring { animation: none; }
    #editor { transition: none; }
  }
</style>
</head>

<body>

<!-- Full screen loading state, hidden by builder.js in a finally block -->
<div id="loader" role="status" aria-live="polite">
  <div class="loader-ring" aria-hidden="true"></div>
  <p>Preparing your card...</p>
</div>

<!-- Errors (missing files, runtime problems) are printed here -->
<div id="errorBox" role="alert" hidden></div>

<header class="app-header">
  <h1>Nikah Card Builder</h1>
  <div class="header-actions">
    <button id="resetBtn" class="btn" type="button" aria-label="Reset the card and clear the draft">Reset</button>
    <button id="downloadBtn" class="btn btn-gold" type="button" aria-label="Download the finished card as an HTML file">Download Card</button>
  </div>
</header>

<main class="app-main">

  <!-- LEFT: the editor. builder.js fills every panel. -->
  <section id="editor" aria-label="Card editor">
    <div class="sheet-handle" aria-hidden="true">
      <div class="sheet-grip"></div>
    </div>

    <div class="tabs" id="tabs" role="tablist" aria-label="Editor sections">
      <button class="tab active" type="button" role="tab" id="tab-basic" data-tab="basic"
              aria-selected="true" aria-controls="panel-basic">Basic</button>
      <button class="tab" type="button" role="tab" id="tab-events" data-tab="events"
              aria-selected="false" aria-controls="panel-events">Events</button>
      <button class="tab" type="button" role="tab" id="tab-story" data-tab="story"
              aria-selected="false" aria-controls="panel-story">Story &amp; Photos</button>
      <button class="tab" type="button" role="tab" id="tab-music" data-tab="music"
              aria-selected="false" aria-controls="panel-music">Music</button>
      <button class="tab" type="button" role="tab" id="tab-rsvp" data-tab="rsvp"
              aria-selected="false" aria-controls="panel-rsvp">Contacts &amp; RSVP</button>
      <button class="tab" type="button" role="tab" id="tab-theme" data-tab="theme"
              aria-selected="false" aria-controls="panel-theme">Theme</button>
    </div>

    <div class="panels" id="panels">
      <div class="panel active" id="panel-basic" data-panel="basic" role="tabpanel"
           aria-labelledby="tab-basic" tabindex="0"></div>
      <div class="panel" id="panel-events" data-panel="events" role="tabpanel"
           aria-labelledby="tab-events" tabindex="0"></div>
      <div class="panel" id="panel-story" data-panel="story" role="tabpanel"
           aria-labelledby="tab-story" tabindex="0"></div>
      <div class="panel" id="panel-music" data-panel="music" role="tabpanel"
           aria-labelledby="tab-music" tabindex="0"></div>
      <div class="panel" id="panel-rsvp" data-panel="rsvp" role="tabpanel"
           aria-labelledby="tab-rsvp" tabindex="0"></div>
      <div class="panel" id="panel-theme" data-panel="theme" role="tabpanel"
           aria-labelledby="tab-theme" tabindex="0"></div>
    </div>

    <p class="note" id="deployNote">
      Download, put the file in a folder as index.html, drag the folder to Netlify Drop
      (app.netlify.com/drop), share the link.
    </p>

    <p class="save-note" id="saveNote">Draft saved automatically</p>
  </section>

  <!-- RIGHT: the live preview inside a phone shaped frame -->
  <section class="preview-wrap" aria-label="Live preview">
    <div class="phone">
      <iframe id="previewFrame"
              title="Live preview of the Nikah card"
              sandbox="allow-scripts allow-modals"></iframe>
    </div>
    <p class="preview-label">Live preview</p>
  </section>

</main>

<!-- Mobile: opens the bottom sheet editor -->
<button id="editBtn" class="edit-fab" type="button" aria-label="Open the card editor">
  Edit
</button>
<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>

<noscript>
  <p style="padding:20px;color:#ffd9d9;font-family:monospace;">
    This builder needs JavaScript enabled.
  </p>
</noscript>

<!-- Load order matters: style, runtime, data/builder of the card, then the editor -->
<script src="card-style.js"></script>
<script src="card-runtime.js"></script>
<script src="card.js"></script>
<script src="builder.js"></script>

</body>
</html>
<!-- END OF FILE index.html -->
